<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NodeNotes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- Панель управления -->
    <div id="top-panel">
        <button class="panel-btn" id="btn-mode" title="Переключить режим">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v-2zm4 5h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span id="mode-text">Режим: Nodes</span>
        </button>
        <div class="panel-divider"></div>
        <button class="panel-btn" id="btn-focus" title="Найти все заметки">
            <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            Фокус
        </button>
        <button class="panel-btn" id="btn-group" title="Сгруппировать выделенные">
            <svg viewBox="0 0 24 24"><path d="M22 13h-8v-2h8v2zm0-6h-8v2h8V7zm-8 10h8v-2h-8v2zm-2-8v6c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2h6c1.1 0 2 .9 2 2z"/></svg>
            <span class="group-text">Группа</span>
        </button>
        <div class="panel-divider"></div>
        <!-- AI Buttons -->
        <button class="panel-btn" id="btn-auto-title" title="Авто-названия нод">
            <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
            Авто-названия
        </button>
        <button class="panel-btn" id="btn-spellcheck" title="Исправить орфографию">
            <svg viewBox="0 0 24 24"><path d="M12.45 16h2.09L10 4H8L3.46 16h2.09l1.12-3h4.62l1.16 3zm-5.02-5L9 6.18 10.57 11H7.43zm14.16.51c-1.93 0-3.5 1.57-3.5 3.5s1.57 3.5 3.5 3.5 3.5-1.57 3.5-3.5-1.57-3.5-3.5-3.5zm0 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Орфография
        </button>
        <button class="panel-btn" id="btn-app-builder" title="Построить приложение из нод">
            <svg viewBox="0 0 24 24"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            Приложение
        </button>
        <div class="panel-divider"></div>
        <button class="panel-btn" id="btn-theme" title="Переключить тему">
            <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            Тема
        </button>
        <button class="panel-btn" id="btn-export" title="Сохранить файл">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Экспорт
        </button>
        <!-- Settings -->
        <div class="panel-divider"></div>
        <button class="panel-btn" id="btn-settings" title="Настройки панели">
            <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
            Настройки
        </button>
    </div>

    <!-- Адаптивная сетка -->
    <canvas id="grid-canvas"></canvas>

    <!-- Холст для нод и связей -->
    <div id="workspace">
        <svg id="svg-layer"></svg>
        <div id="nodes-container"></div>
    </div>

    <!-- ⚙ Панель настроек -->
    <div id="settings-panel" style="display:none; position:absolute; right:20px; top:80px; z-index:1000; background:var(--panel-bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--panel-border); border-radius:12px; padding:14px; width:300px; flex-direction:column; gap:10px; box-shadow:0 4px 24px var(--node-shadow); max-height:calc(100vh - 100px); overflow-y:auto;">
        <div style="font-weight:600;font-size:14px;margin-bottom:2px;">⚙ Настройки панели</div>

        <!-- Custom Button Form -->
        <div style="font-size:11px;font-weight:600;color:#a855f7;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;">+ Добавить кнопку на панель</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <input id="settings-btn-name" type="text" placeholder="Название кнопки"
                style="width:100%;background:var(--input-bg);color:var(--text-main);border:1px solid var(--node-border);border-radius:6px;padding:7px 9px;font-size:12px;font-family:Inter,sans-serif;outline:none;pointer-events:auto;user-select:text;-webkit-user-select:text;box-sizing:border-box;">
            <textarea id="settings-btn-svg" placeholder="SVG-код иконки (необязательно)" rows="2"
                style="width:100%;background:var(--input-bg);color:var(--text-main);border:1px solid var(--node-border);border-radius:6px;padding:7px 9px;font-size:11px;font-family:monospace;outline:none;resize:vertical;pointer-events:auto;user-select:text;-webkit-user-select:text;box-sizing:border-box;"></textarea>
            <textarea id="settings-btn-code" placeholder="JS-код кнопки&#10;// Доступно: state, createNode, renderEdges,&#10;// complete, streamCompletion, getApiKey, getModel" rows="5"
                style="width:100%;background:var(--input-bg);color:var(--text-main);border:1px solid var(--node-border);border-radius:6px;padding:7px 9px;font-size:11px;font-family:monospace;outline:none;resize:vertical;pointer-events:auto;user-select:text;-webkit-user-select:text;box-sizing:border-box;"></textarea>
            <button id="btn-custom-btn-add"
                style="background:#a855f7;color:white;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;pointer-events:auto;">
                Добавить на панель
            </button>
        </div>

        <!-- Existing custom buttons list -->
        <div style="height:1px;background:var(--node-border);margin:4px 0;"></div>
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Мои кнопки</div>
        <div id="settings-custom-list"></div>

        <!-- Built-in button visibility (future) -->
        <div style="height:1px;background:var(--node-border);margin:4px 0;"></div>
        <div style="font-size:11px;color:var(--text-muted);">
            Кастомные кнопки сохраняются между сессиями в localStorage.<br>
            Документация: <code style="font-size:10px;">MODDING_API.md</code>
        </div>
    </div>

    <!-- Меню Лаборатории (Плавающее) -->
    <div id="lab-menu" style="display: none; position: absolute; left: 20px; top: 80px; z-index: 1000; background: var(--panel-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--panel-border); border-radius: 12px; padding: 12px; width: 260px; flex-direction: column; gap: 10px; box-shadow: 0 4px 24px var(--node-shadow); max-height: calc(100vh - 100px); overflow-y: auto;">
        <div style="font-weight: 600; font-size: 14px; margin-bottom: 5px;">Лаборатория</div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 12px; color: var(--text-muted);" for="lab-provider-select">Провайдер:</label>
            <select id="lab-provider-select" style="width: 100%; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--node-border); border-radius: 6px; padding: 8px; font-size: 12px;">
                <option value="groq">Groq</option>
                <option value="deepseek">DeepSeek</option>
            </select>
        </div>

        <div id="lab-groq-section" style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 12px; color: var(--text-muted);">Groq API Key</label>
            <input type="password" id="lab-api-key" style="width: 100%; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--node-border); border-radius: 6px; padding: 8px; font-size: 12px;" placeholder="gsk_...">
        </div>

        <div id="lab-deepseek-section" style="display: none; flex-direction: column; gap: 4px;">
            <label style="font-size: 12px; color: var(--text-muted);">DeepSeek API Key</label>
            <input type="password" id="lab-deepseek-key" style="width: 100%; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--node-border); border-radius: 6px; padding: 8px; font-size: 12px;" placeholder="sk-...">
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 12px; color: var(--text-muted);" for="lab-model-select">Модель:</label>
            <select id="lab-model-select" style="width: 100%; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--node-border); border-radius: 6px; padding: 8px; font-size: 12px;">
                <option value="llama3-8b-8192">llama3-8b-8192 (Default)</option>
            </select>
            <button id="btn-fetch-models" class="panel-btn" style="width: 100%; justify-content: center; background: var(--selection); color: var(--bg-color); padding: 8px; font-size: 11px;">Загрузить Модели</button>
        </div>

        <div style="height: 1px; background: var(--node-border); margin: 5px 0;"></div>

        <div style="font-weight: 500; font-size: 12px; color: var(--text-muted);">Добавить ноду:</div>
        <button id="btn-add-input-node" class="panel-btn" style="width: 100%; justify-content: center; background: var(--grid-main);">+ Input Notes Node</button>
        <button id="btn-add-story-node" class="panel-btn" style="width: 100%; justify-content: center; background: var(--grid-main);">📖 Book Generator Node</button>
        <button id="btn-add-chat-node" class="panel-btn" style="width: 100%; justify-content: center; background: var(--grid-main);">💬 Chat Node</button>
        <button id="btn-add-export-node" class="panel-btn" style="width: 100%; justify-content: center; background: var(--grid-main);">📤 Export Node</button>

        <div style="height: 1px; background: var(--node-border); margin: 5px 0;"></div>

        <div style="height: 1px; background: var(--node-border); margin: 5px 0;"></div>

        <div style="font-weight: 500; font-size: 12px; color: var(--text-muted);">Загруженные Моды:</div>
        <div id="lab-mods-list" style="display: flex; flex-direction: column; gap: 4px;"></div>

        <div style="height: 1px; background: var(--node-border); margin: 5px 0;"></div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 12px; color: var(--text-muted);">Загрузить Мод (.js / .zip)</label>
            <input type="file" id="lab-mod-upload" accept=".js,.zip" style="font-size: 10px; width: 100%; color: var(--text-main);">
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
